<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — WoW: Forever Guides</title>
<meta name="theme-color" content="#14110e">
<link href="https://fonts.googleapis.com/css2?family=Cinzel&family=Alegreya&display=swap" rel="stylesheet">
<style>
  /* GitHub Pages serves this file for any unknown path, at any depth, so it can't rely on relative links. */
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    font: 18px/1.6 Alegreya, Georgia, serif; color: #e8e0cc;
    background: radial-gradient(ellipse at 50% 0%, rgba(90, 70, 40, .35), transparent 60%), #0c0a08;
  }
  .box {
    max-width: 460px; text-align: center; padding: 34px 28px 28px;
    background: linear-gradient(#1c1915, #14110e); border: 3px solid #4a443c; border-radius: 6px;
    box-shadow: inset 0 0 0 1px #7a5c1e, inset 0 0 0 3px #000, 0 0 0 1px #000, 0 10px 30px rgba(0, 0, 0, .7);
  }
  h1 { margin: 0; font-weight: normal; color: #ffd100; font-size: 34px; text-shadow: 0 2px 2px #000; }
  p { color: #a99d84; }
  a {
    display: inline-block; margin-top: 8px; padding: 8px 20px; color: #ffd100; text-decoration: none;
    background: linear-gradient(#b11f13, #6b0c06 55%, #4a0703); border: 1px solid #c8a24a; border-radius: 4px;
    box-shadow: 0 0 0 1px #000, inset 0 1px 0 rgba(255, 255, 255, .25);
  }
  a:hover { filter: brightness(1.25); }
</style>
</head>
<body>
  <div class="box">
    <h1>You've wandered off the map</h1>
    <p>This page doesn't exist, or it moved. Your guide progress is safe.</p>
    <a id="home" href="/">Back to all guides</a>
  </div>
  <script>
    // on GitHub Pages project sites the site lives under /<repo>/ — send people there, not to the domain root
    var parts = location.pathname.split("/").filter(Boolean);
    var root = location.hostname.endsWith("github.io") && parts.length ? "/" + parts[0] + "/" : "/";
    document.getElementById("home").href = root;
    // pages that were merged into one shared page: send old bookmarks there
    var MOVED = {
      "Gnome-Mage-Professions.html": "professions.html?c=gnome-mage",
      "NightElf-Rogue-Professions.html": "professions.html?c=nightelf-rogue",
      "Gnome-Mage-Addons.html": "addons.html?c=gnome-mage",
      "NightElf-Rogue-Addons.html": "addons.html?c=nightelf-rogue"
    };
    var to = MOVED[decodeURIComponent(parts[parts.length - 1] || "")];
    if (to) location.replace(root + to + location.hash);
  </script>
</body>
</html>
