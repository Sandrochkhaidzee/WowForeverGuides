# Builds the WoW Forever Guide addon from the website guides and publishes it as a GitHub release.
# Runs whenever a guide (or the addon) changes on main, so the addon always matches the site.
# The website's download button points at releases/latest/download/WowForeverGuide.zip.
name: Addon release

on:
  push:
    branches: [main]
    paths:
      - "addon/**"
      - "tools/export-addon-guide.js"
      - "*/data/guide.js"
      - "*/*-WoW-Guide.html"
      - "data/words.js"
      - "assets/js/characters.js"
      - ".github/workflows/addon-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: addon-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version number is the commit count

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the addon from the website guides
        run: node tools/export-addon-guide.js --zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(cat dist/version.txt)"
          TAG="v$VERSION"
          cat > notes.md <<'EOF'
          The WoW Forever leveling guide from the website, step by step in game. Made from the website guides, so it always matches the site.

          **Install**
          1. Download `WowForeverGuide.zip` below.
          2. Unzip it into `World of Warcraft\_forever_\Interface\AddOns` so you get an `AddOns\WowForeverGuide` folder.
          3. Restart the game (or type `/reload`). Click the book button on your minimap.

          Works best with **TomTom** installed (for the arrow).
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/WowForeverGuide.zip --clobber
          else
            gh release create "$TAG" dist/WowForeverGuide.zip --title "WoW Forever Guide $VERSION" --notes-file notes.md --latest
          fi
